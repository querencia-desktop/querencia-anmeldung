# Sitzungen im Anmeldebildschirm der Querencia Anmeldung.
# Gelesen bei jedem Erscheinen des Anmeldebildschirms von
# /usr/libexec/querencia-anmeldung/sitzungen-auswahl (querencia-anmeldung(8)).
# Format: eine Zeile "schlüssel = wert"; Zeilen mit # sind Kommentare.
#
# Angeboten werden immer die Sitzungen von Querencia Desktop (DesktopNames
# enthält X-Querencia). Andere Sitzungen aus /usr/share/wayland-sessions
# und /usr/local/share/wayland-sessions erscheinen nur, wenn sie hier
# freigegeben sind. Die nackte labwc-Sitzung (Compositor ohne Panel) und
# X11-Sitzungen (xsessions) bietet die Querencia Anmeldung nie an.
#
# ACHTUNG GNOME: GNOME braucht GDM für die Bildschirmsperre. Unter der
# Querencia Anmeldung läuft GNOME ohne Bildschirmsperre ("Die Sperrung
# des Bildschirms erfordert den GNOME Display-Manager"). Wer GNOME nutzt,
# lässt GDM den Standard-Anmeldedienst (sudo dpkg-reconfigure
# querencia-anmeldung) und gibt GNOME hier nur bewusst frei.

# freigeben: Namen von Sitzungsdateien ohne ".desktop", durch Leerzeichen
# getrennt, z. B. "freigeben = ubuntu" für Ubuntu (GNOME).
freigeben =

# huelle: ja = jede Sitzung startet über
# /usr/libexec/querencia-anmeldung/sitzung-starten, das XDG_CURRENT_DESKTOP,
# XDG_SESSION_DESKTOP, DESKTOP_SESSION und XDG_SESSION_TYPE wie GDM setzt.
# nein = Rückfall auf den Stand 0.1.0: dieselben Sitzungen, aber ohne diese
# Variablen gestartet.
huelle = ja
