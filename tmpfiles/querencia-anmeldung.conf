# Zustand (zuletzt gewählter Benutzer und Sitzung) und Protokoll von ReGreet,
# gebaut mit STATE_DIR und LOG_DIR auf diese Ordner.
d /var/lib/querencia-anmeldung 0755 _greetd _greetd -
d /var/log/querencia-anmeldung 0755 _greetd _greetd -
# Sitzungsliste für ReGreet (gebaut mit SESSION_DIRS auf
# /run/querencia-anmeldung/wayland-sessions), bei jedem Erscheinen des
# Anmeldebildschirms neu erzeugt von sitzungen-auswahl.
d /run/querencia-anmeldung 0755 _greetd _greetd -
